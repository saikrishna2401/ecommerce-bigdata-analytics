# ==============================================================================
# E-Commerce Big Data Analytics - Central Configuration
# ==============================================================================

# HDFS Root Directory
PROJECT_HDFS_ROOT=/project-2

# Raw Ingestion Root (landing zone for incoming weekly batches)
RAW_ROOT=/project-2/raw

# Clean Data Root (validated and cleaned records from Pig)
CLEAN_ROOT=/project-2/clean

# Rejected Data Root (records failing quality checks)
REJECT_ROOT=/project-2/reject

# Reports Root
REPORT_ROOT=/project-2/reports

# Weekly Reports Root (weekly summaries, aggregations)
WEEKLY_REPORT_ROOT=/project-2/reports/weekly

# Historical Reports Root (multi-week trends and longitudinal metrics)
HISTORICAL_REPORT_ROOT=/project-2/reports/historical

# Recommendations Root (product recommendation outputs)
RECOMMENDATION_ROOT=/project-2/reports/recommendations

# Evaluation Root (validation, test metrics, model/pipeline evaluations)
EVALUATION_ROOT=/project-2/reports/evaluation

# Hive Database Name
HIVE_DATABASE=project2

# Hive Transactions Table Name
HIVE_TABLE=ecommerce_transactions

# Currency Symbol for Reporting (assumed project reporting currency)
CURRENCY_SYMBOL="₹"

# Product Association Recommendation Thresholds
# Minimum co-occurrence count in orders
MIN_PAIR_COUNT=1
# Minimum confidence threshold (0.0 to 1.0)
MIN_CONFIDENCE=0.10
